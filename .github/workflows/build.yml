herename: Build SkUtils APK

# Phone se build karne ke liye:
#   1. Is file ko repo me .github/workflows/build.yml par rakho
#   2. skutils.zip ko repo ke root me upload kar do (as single file)
#   3. Actions tab -> "Build SkUtils APK" -> "Run workflow"
#   4. 2-4 min baad "Artifacts" me APK milega

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o skutils.zip -d extracted
          # handle both: zip containing a top-level "skutils" folder, or files directly
          if [ -d "extracted/skutils" ]; then
            cp -r extracted/skutils/. .
          else
            cp -r extracted/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle (no wrapper committed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkUtils-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
